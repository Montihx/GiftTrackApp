# nginx.conf — HTTPS reverse proxy для TWA (фронтенд + API + SSE + вебхук оплаты)
# Домен и сертификаты Let's Encrypt привязаны к боевому хосту; при смене домена
# замените gifttrack.155.248.234.68.sslip.io во всех местах файла.

client_max_body_size 10m;

# Docker DNS: переопределяем адреса контейнеров, чтобы после пересоздания
# twa-api / twa-frontend не было 502 (без перезапуска nginx)
resolver 127.0.0.11 valid=5s ipv6=off;

# --- HTTP: только редирект на HTTPS ---
server {
    listen 80;
    server_name gifttrack.155.248.234.68.sslip.io;

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    http2 on;
    server_name gifttrack.155.248.234.68.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/gifttrack.155.248.234.68.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gifttrack.155.248.234.68.sslip.io/privkey.pem;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # --- Статика React-приложения (TWA) ---
    location / {
        set $frontend http://twa-frontend:80;
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SSE-стримы (/api/collections/<id>/stream): без буферизации, долгий таймаут ---
    location ~ ^/api/collections/[^/]+/stream$ {
        set $api http://twa-api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        add_header Cache-Control no-cache;
        add_header X-Accel-Buffering no;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- REST API ---
    location /api/ {
        set $api http://twa-api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Webhook CryptoBot (оплата подписки) ---
    location /webhooks/ {
        set $api http://twa-api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
