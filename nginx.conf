# /workspace/nginx.conf — reverse proxy для TWA API + фронтенда (+SSE буферизация выключена)
server {
    listen 80;
    server_name _;

    # Telegram требует HTTPS; на боевом сервере сюда добавляете
    # сертификат Let's Encrypt (certbot) и listen 443 ssl;.

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # --- Статика React-приложения (TWA) ---
    location / {
        proxy_pass http://twa-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SSE-стримы: без буферизации, долгий таймаут ---
    location /api/sse/ {
        proxy_pass http://twa-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        cache_control no-cache;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- REST API ---
    location /api/ {
        proxy_pass http://twa-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Webhook CryptoBot (оплата подписки) ---
    location /webhooks/ {
        proxy_pass http://twa-api:8000;
        proxy_set_header Host $host;
    }
}
