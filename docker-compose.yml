# /workspace/docker-compose.yml — вся инфраструктура Gift Track Bot
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gifttrack
      POSTGRES_USER: gt
      POSTGRES_PASSWORD: ${DB_PASS:-pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gt -d gifttrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Миграция БД выполняется один раз перед стартом сервисов
  migrate:
    build: .
    image: gifttrack-app:latest
    command: alembic upgrade head
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build: .
    image: gifttrack-app:latest
    command: python -m bot.bot_main
    env_file: .env
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  listener-ton:
    build: .
    image: gifttrack-app:latest
    command: python -m bot.listener_main
    env_file: .env
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  listener-market:
    build: .
    image: gifttrack-app:latest
    command: python -m bot.market_main
    env_file: .env
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  resolver:
    build: .
    image: gifttrack-app:latest
    command: python -m bot.resolver_main
    env_file: .env
    volumes:
      - tgsessions:/app/sessions
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  updater:
    build: .
    image: gifttrack-app:latest
    command: python -m services.updater
    env_file: .env
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  twa-api:
    build: .
    image: gifttrack-app:latest
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 6

  twa-frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - twa-api

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - twa-api
      - twa-frontend

volumes:
  pgdata:
  redisdata:
  tgsessions:
